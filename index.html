<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma de Matrices</title>
</head>
<body>
    <h1>Suma de dos matrices</h1>
    
    <form id="matriz-form">
        <label for="filas">Filas:</label>
        <input type="number" id="filas" name="filas" min="1" required><br><br>
        
        <label for="columnas">Columnas:</label>
        <input type="number" id="columnas" name="columnas" min="1" required><br><br>
        
        <button type="button" onclick="generarMatrices()">Generar Matrices</button>
    </form>
    
    <div id="matrices-inputs"></div>
    
    <button id="calcular" style="display:none;" onclick="calcularSuma()">Calcular Suma</button>
    
    <h2>Resultado</h2>
    <div id="resultado"></div>

    <script>
        function generarMatrices() {
            const filas = document.getElementById("filas").value;
            const columnas = document.getElementById("columnas").value;
            
            if (filas && columnas) {
                let matrizHTML = "<h3>Matriz 1:</h3><table>";
                for (let i = 0; i < filas; i++) {
                    matrizHTML += "<tr>";
                    for (let j = 0; j < columnas; j++) {
                        matrizHTML += `<td><input type="number" id="mat1-${i}-${j}" required></td>`;
                    }
                    matrizHTML += "</tr>";
                }
                matrizHTML += "</table><h3>Matriz 2:</h3><table>";
                for (let i = 0; i < filas; i++) {
                    matrizHTML += "<tr>";
                    for (let j = 0; j < columnas; j++) {
                        matrizHTML += `<td><input type="number" id="mat2-${i}-${j}" required></td>`;
                    }
                    matrizHTML += "</tr>";
                }
                matrizHTML += "</table>";

                document.getElementById("matrices-inputs").innerHTML = matrizHTML;
                document.getElementById("calcular").style.display = "block";
            }
        }

        function calcularSuma() {
            const filas = document.getElementById("filas").value;
            const columnas = document.getElementById("columnas").value;

            let matriz1 = [];
            let matriz2 = [];

            // Obtener los valores de las matrices
            for (let i = 0; i < filas; i++) {
                let fila1 = [];
                let fila2 = [];
                for (let j = 0; j < columnas; j++) {
                    let val1 = document.getElementById(`mat1-${i}-${j}`).value;
                    let val2 = document.getElementById(`mat2-${i}-${j}`).value;

                    if (isNaN(val1) || isNaN(val2)) {
                        alert("Por favor, ingresa valores numéricos en ambas matrices.");
                        return;
                    }

                    fila1.push(parseFloat(val1));
                    fila2.push(parseFloat(val2));
                }
                matriz1.push(fila1);
                matriz2.push(fila2);
            }

            // Enviar las matrices al servidor (Express)
            fetch('http://localhost:8000/sumar_matrices', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ matriz1: matriz1, matriz2: matriz2 })
            })
            .then(response => response.json())
            .then(data => {
                mostrarResultado(data.resultado);
            })
            .catch(error => console.error('Error:', error));
        }

        function mostrarResultado(resultado) {
            let resultadoHTML = "<table>";
            for (let i = 0; i < resultado.length; i++) {
                resultadoHTML += "<tr>";
                for (let j = 0; j < resultado[i].length; j++) {
                    resultadoHTML += `<td>${resultado[i][j]}</td>`;
                }
                resultadoHTML += "</tr>";
            }
            resultadoHTML += "</table>";
            document.getElementById("resultado").innerHTML = resultadoHTML;
        }
    </script>
</body>
</html>
